name: Update VPNGate MS-SSTP

on:
  schedule:
    # هر روز ساعت 00:00 UTC
    - cron: "0 0 * * *"

  # اجرای دستی از GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpngate-sstp-update
  cancel-in-progress: true

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # Setup Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ======================================================
      # Install dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # Run collector
      # ======================================================

      - name: Run VPNGate collector
        run: |
          python collect.py

      # ======================================================
      # Commit changed files
      # ======================================================

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/servers.json
          git add data/sstp.txt

          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "Update VPNGate MS-SSTP servers"

            git push

          fi
